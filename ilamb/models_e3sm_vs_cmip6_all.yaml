# Experiment: E3SM ensembles vs CMIP6 individual models and CMIP6 ensemble.
#
# Models: E3SM (default/highECS/lowECS), 5 individually tracked CMIP6 models,
# and the CMIP6 multi-model mean. Paths match the validated models_combined.yaml.
# The `modelname` field controls the label shown in ILAMB figures and scorecards.

v3.LR:
  modelname: E3SMv3 default
  color: "#31a354"
  path: /global/cfs/cdirs/e3sm/feng809/v3.XLE/e3sm/output/LR/v3.LR.historical_ens

v3.LR.highECS:
  modelname: E3SMv3 highECS
  color: "#e6550d"
  path: /global/cfs/cdirs/e3sm/feng809/v3.XLE/e3sm/output/highECS/v3.highECS.historical_ens

v3.LR.lowECS:
  modelname: E3SMv3 lowECS
  color: "#3182bd"
  path: /global/cfs/cdirs/e3sm/feng809/v3.XLE/e3sm/output/lowECS/v3.lowECS.historical_ens

CMIP6-MMM:
  modelname: CMIP6 ens
  color: "#17bfd0"
  path: /global/cfs/cdirs/e3sm/feng809/v3.XLE/cmip6/output/cmip_ens

MIROC-ES2L:
  modelname: MIROC-ES2L
  color: "#3183be"
  path: /global/cfs/cdirs/e3sm/feng809/v3.XLE/cmip6/output/MIROC-ES2L

CanESM5:
  modelname: CanESM5
  color: "#637939"
  path: /global/cfs/cdirs/e3sm/feng809/v3.XLE/cmip6/output/CanESM5

IPSL-CM6A-LR:
  modelname: IPSL-CM6A-LR
  color: "#756bb2"
  path: /global/cfs/cdirs/e3sm/feng809/v3.XLE/cmip6/output/IPSL-CM6A-LR

NorESM2-LM:
  modelname: NorESM2-LM
  color: "#2ca02c"
  path: /global/cfs/cdirs/e3sm/feng809/v3.XLE/cmip6/output/NorESM2-LM

UKESM1-0-LL:
  modelname: UKESM1-0-LL
  color: "#9467bd"
  path: /global/cfs/cdirs/e3sm/feng809/v3.XLE/cmip6/output/UKESM1-0-LL
