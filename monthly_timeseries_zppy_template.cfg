machine   = pm-cpu
partition = regular
account   = e3sm
environment_commands = "source /global/common/software/e3sm/anaconda_envs/load_latest_e3sm_unified_pm-cpu.sh"

[ts]
active   = True
years    = "1950:2024:5"
walltime = "0:05:00"


  [[ atm_monthly_native ]]
  input_subdir = "archive/atm/hist"
  input_files  = "eam.h0"
  mapping_file = ""
  frequency    = "monthly"
  vars         = "SWCF,LWCF,TGCLDLWP"